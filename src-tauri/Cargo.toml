[package]
name = "zenreader"
version = "0.1.4"
description = "ZenReader · 禅阅读 — 本地优先的 Markdown 阅读器"
authors = ["谢光湘"]
edition = "2021"

[lib]
name = "zenreader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
rfd = "0.15"
# bundled 从源码编译 SQLite，避免桌面分发依赖系统 SQLite；default-features=false 去掉
# 用不上的 cache/wasm 特性（连接按命令开关，语句缓存无收益）。
rusqlite = { version = "0.40.2", features = ["bundled"], default-features = false }
